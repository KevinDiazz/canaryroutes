<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="420" fill="url(#sky)"/>
  <!-- Ocean -->
  <rect y="420" width="1200" height="210" fill="url(#ocean)"/>
  <!-- Wave -->
  <path d="M0,420 Q300,390 600,420 Q900,450 1200,420 L1200,470 Q900,440 600,470 Q300,500 0,470 Z" fill="#0369a1" opacity="0.5"/>
  <!-- Island silhouette -->
  <ellipse cx="600" cy="390" rx="340" ry="90" fill="#f5c518" opacity="0.15"/>
  <path d="M300,400 Q450,280 600,260 Q750,280 900,400 Q800,380 600,370 Q400,380 300,400 Z" fill="#e2d5b0"/>
  <!-- Sun -->
  <circle cx="960" cy="120" r="70" fill="#fcd34d" opacity="0.9"/>
  <!-- Logo text -->
  <text x="600" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="82" font-weight="700" fill="white" opacity="0.95" letter-spacing="2">CanaryRoutes</text>
  <!-- Tagline -->
  <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.80" letter-spacing="4">ISLAS CANARIAS</text>
  <!-- Bottom bar -->
  <rect y="560" width="1200" height="70" fill="#1a1a2e" opacity="0.7"/>
  <text x="600" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#f5c518" letter-spacing="6">canaryroutes.com</text>
</svg>